name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: [self-hosted, rpi]   # RPI self-hosted — no GHA minutes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true   # self-hosted: GRADLE_USER_HOME persists locally; skip the hanging Post cache upload
      - run: ./gradlew test buildPlugin --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: build/distributions/*.zip
